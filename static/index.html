<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LocalMusic</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="/icon.svg" alt=""> LocalMusic</div>
      <nav class="nav">
        <a href="#/songs" data-view="songs">🎵 <span>Canciones</span></a>
        <a href="#/albums" data-view="albums">💿 <span>Álbumes</span></a>
        <a href="#/artists" data-view="artists">🎤 <span>Artistas</span></a>
        <a href="#/queue" data-view="queue">📜 <span>Cola</span></a>
        <a href="#/playlists" data-view="playlists" class="mobile-only">📂 <span>Playlists</span></a>
      </nav>
      <div class="playlists-side">
        <div class="side-head">
          <span>Tus playlists</span>
          <button class="icon-btn" id="newPlaylistBtn" title="Nueva playlist">＋</button>
        </div>
        <ul id="playlistNav"></ul>
      </div>
      <button class="rescan" id="rescanBtn" title="Volver a escanear la carpeta de música">⟳ Re-escanear biblioteca</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <input id="search" type="search" placeholder="Buscar canciones, artistas o álbumes…" autocomplete="off">
      </header>
      <section id="view" class="view"></section>
    </main>

    <footer class="player">
      <div class="now">
        <img id="npCover" class="cover-sm" alt="" src="/icon.svg">
        <div class="now-text">
          <div id="npTitle" class="np-title">Nada sonando</div>
          <div id="npArtist" class="np-artist"></div>
        </div>
      </div>
      <div class="center">
        <div class="controls">
          <button class="icon-btn" id="shuffleBtn" title="Aleatorio (S)">⇄</button>
          <button class="icon-btn" id="prevBtn" title="Anterior">⏮</button>
          <button class="play-btn" id="playBtn" title="Reproducir/Pausar (Espacio)">▶</button>
          <button class="icon-btn" id="nextBtn" title="Siguiente">⏭</button>
          <button class="icon-btn" id="repeatBtn" title="Repetir (R)">↻</button>
        </div>
        <div class="progress">
          <span id="curTime">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición">
          <span id="durTime">0:00</span>
        </div>
      </div>
      <div class="right">
        <button class="icon-btn" id="muteBtn" title="Silenciar (M)">🔊</button>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volumen">
      </div>
    </footer>
  </div>

  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <audio id="audio" preload="auto"></audio>
  <script src="/app.js"></script>
</body>
</html>
